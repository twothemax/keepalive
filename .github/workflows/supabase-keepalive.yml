
name: Supabase keep-alive
 
on:
  schedule:
    - cron: "17 15 * * *"   # once a day (~8am Pacific)
  workflow_dispatch:         # lets you run it manually from the Actions tab
 
permissions:
  contents: write            # only used by the monthly heartbeat commit
 
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        project: [VCF, AERO]
    steps:
      - name: Read one row from keep_alive (${{ matrix.project }})
        env:
          URL: ${{ secrets[format('SUPABASE_{0}_URL', matrix.project)] }}
          KEY: ${{ secrets[format('SUPABASE_{0}_ANON_KEY', matrix.project)] }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: $KEY")
          echo "HTTP $status"
          [ "$status" = "200" ] || exit 1
 
  # GitHub turns off scheduled workflows in repos with no activity for 60 days.
  # On the 1st of each month this makes a tiny commit so that never happens.
  heartbeat:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Monthly heartbeat commit
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u > heartbeat.txt
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "heartbeat $(date -u +%F)"
            git push
          else
            echo "Not the 1st, skipping."
          fi
 
